<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#241b2f">
  <title>日行一善 · M-TOWN 黑市论坛</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="desktop-wrapper">
    <header class="browser-header">
      <div class="browser-title">
        <span class="pixel-mark">◆</span>
        FOUND-DOG.ONLINE / M-TOWN BBS
      </div>
      <div class="window-controls" aria-hidden="true"><span>_</span><span>□</span><span>×</span></div>
      <div class="address-bar">http://found-dog.online/m-town/bbs/index.html</div>
    </header>

    <div class="mobile-topbar">
      <span>FOUND-DOG.ONLINE</span>
      <span id="mobileCoins">🐟 12500</span>
    </div>

    <div class="layout">
      <aside class="sidebar">
        <div class="hanging-line"></div>
        <button class="side-item seal" id="homeBtn" title="首页">善</button>
        <button class="side-item pixel-btn toggle active" id="btnLand">陆党</button>
        <button class="side-item pixel-btn toggle" id="btnWater">水党</button>
        <button class="side-item pixel-btn text-link" id="navMail">信箱 <span class="badge" id="mailBadge">1</span></button>
        <button class="side-item icon-link active" id="navCat">猫版</button>
        <button class="side-item icon-link" id="navDog">狗版</button>
        <button class="side-item icon-link locked" title="尚未开放">聚宝楼</button>
        <div class="side-item coin-display land-only">🐟<br><span id="coinCount">12500</span></div>
        <button class="side-item pixel-btn admin-switch land-only" id="adminToggle">BLACK<br>HAND</button>
      </aside>

      <main class="content-shell">
        <div class="ticker"><span>◆ M町匿名互助论坛 ◆ 严禁人肉 ◆ 违规者由 BLACKHAND 亲自处理 ◆</span></div>
        <section class="content" id="appContent"></section>
      </main>
    </div>
  </div>

  <nav class="mobile-nav">
    <button class="nav-btn active" id="mobileHome"><span class="icon">⌂</span><span>首页</span></button>
    <button class="nav-btn" id="mobileCat"><span class="icon">猫</span><span>悬赏</span></button>
    <button class="nav-btn" id="mobileDog"><span class="icon">犬</span><span>八卦</span></button>
    <button class="nav-btn land-only" id="mobileMail"><span class="icon">✉</span><span>信箱</span></button>
  </nav>

  <script src="script.js"></script>
</body>
</html>
