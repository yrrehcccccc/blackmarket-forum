<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#241b2f">
  <meta name="description" content="日行一善 · M-TOWN 匿名论坛互动演示">
  <meta name="m-town-build" content="netlify-static-v7-blackhand-icon">
  <title>日行一善 · M-TOWN 黑市论坛</title>
  <link rel="icon" href="assets/ui/logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="desktop-wrapper">
    <header class="browser-header">
      <div class="browser-title">
        <span class="pixel-mark">◆</span> FOUND-DOG.ONLINE / M-TOWN BBS <span class="version">V4.11</span>
      </div>
      <div class="window-controls" aria-hidden="true"><span>_</span><span>□</span><span>×</span></div>
      <div class="address-row">
        <button class="browser-mini" id="browserBack" title="返回">←</button>
        <button class="browser-mini" id="browserRefresh" title="刷新">↻</button>
        <div class="address-bar" id="addressBar">http://found-dog.online/m-town/bbs/index.html</div>
      </div>
    </header>

    <div class="mobile-topbar">
      <button class="mobile-brand" id="mobileBrand" aria-label="返回日行一善首页">
        <span class="mini-good-logo" aria-hidden="true"><img src="assets/ui/logo.png?v=2" alt=""></span>
        <span class="brand-copy"><strong>日行一善</strong><small>FOUND-DOG.ONLINE // M-TOWN</small></span>
      </button>
      <span class="mobile-status">
        <button id="mobileNotify" class="notify-mini" aria-label="通知">✦<b id="mobileNotifyBadge">3</b></button>
        <span id="mobileCoins">🐟 99999</span>
      </span>
    </div>

    <div class="layout">
      <aside class="sidebar">
        <div class="hanging-line"></div>
        <button class="side-item seal" id="homeBtn" title="首页"><img src="assets/ui/logo.png?v=2" alt="日行一善"></button>
        <div class="party-toggle side-item">
          <button class="pixel-btn toggle active" id="btnLand">陆党</button>
          <button class="pixel-btn toggle" id="btnWater">水党</button>
        </div>
        <button class="side-item pixel-btn text-link land-only" id="navProfile">主页</button>
        <button class="side-item pixel-btn text-link land-only" id="navMail">信箱 <span class="badge" id="mailBadge">1</span></button>
        <button class="side-item pixel-btn text-link land-only" id="navNotify">通知 <span class="badge" id="notifyBadge">3</span></button>
        <button class="side-item icon-link active" id="navCat"><span class="px-icon px-cat" aria-hidden="true"></span><small>猫版</small></button>
        <button class="side-item icon-link" id="navDog"><span class="px-icon px-dog" aria-hidden="true"></span><small>狗版</small></button>
        <button class="side-item icon-link locked" id="navBird" title="善币累计达到10000后开放"><span class="px-icon px-bird" aria-hidden="true"></span><small>聚宝楼</small></button>
        <button class="side-item pixel-btn text-link" id="navSearch">检索</button>
        <button class="side-item pixel-btn text-link land-only" id="navCompose">发帖</button>
        <div class="side-item coin-display land-only">🐟<br><span id="coinCount">99999</span></div>
        <button class="side-item pixel-btn admin-switch land-only" id="adminToggle">BLACK<br>HAND</button>
        <button class="side-item pixel-btn text-link admin-only" id="adminBackendBtn">后台</button>
      </aside>

      <main class="content-shell">
        <div class="ticker"><span id="tickerText">◆ M町匿名互助论坛 ◆ 严禁开盒 ◆ 违规者由土皇帝 BLACKHAND 亲自取缔 ◆</span></div>
        <button class="global-ad-banner" id="globalAdBanner" aria-label="查看暑假营销包宣传">
          <img src="assets/ui/summer-banner.gif" alt="暑假营销包 Banner">
        </button>
        <section class="content" id="appContent" aria-live="polite"></section>
      </main>
    </div>
  </div>

  <nav class="mobile-nav" aria-label="移动端导航">
    <button class="nav-btn active" id="mobileHome"><img class="nav-art" src="assets/ui/nav-home.png" alt=""><span class="sr-only">HOME</span></button>
    <button class="nav-btn" id="mobileBoards"><img class="nav-art" src="assets/ui/nav-playlist.png" alt=""><span class="sr-only">PLAYLIST</span></button>
    <button class="nav-btn" id="mobileHistory"><img class="nav-art" src="assets/ui/nav-history.png" alt=""><span class="sr-only">HISTORY</span></button>
    <button class="nav-btn land-only" id="mobileMore"><img class="nav-art" src="assets/ui/nav-me.png" alt=""><span class="sr-only">ME</span></button>
  </nav>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head"><b id="modalTitle">提示</b><button id="modalClose" aria-label="关闭">×</button></div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>
  <div class="toast-stack" id="toastStack" aria-live="polite"></div>

  <script src="script.js?v=4.11"></script>
</body>
</html>
