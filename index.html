<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#221b2e" />
  <title>日行一善 · 匿名论坛</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="grain"></div>
  <div class="app-shell">
    <header class="browser-frame">
      <div class="tab-row">
        <div class="tab"><span class="tab-dot"></span> 日行一善</div>
        <div class="browser-actions">—　▣　×</div>
      </div>
      <div class="address-row"><span>◉</span> WWW.FOUND-DOG.ONLINE <button id="adminToggle" title="管理员入口">⋮</button></div>
    </header>

    <header class="mobile-topbar">
      <span>日行一善</span>
      <button id="mobileMenuBtn" aria-label="打开菜单">☰</button>
    </header>

    <div class="site-logo" id="siteLogo" aria-label="日行一善">
      <small>FOUND DOG ONLINE</small>
      <span>日行</span><b>一善</b>
    </div>

    <main class="layout">
      <aside class="sidebar" id="sidebar">
        <button class="seal" id="homeSeal" title="返回首页">善</button>
        <div class="account-state" aria-label="身份切换">
          <button class="account active" data-account="land">陆</button>
          <button class="account" data-account="water">水</button>
        </div>
        <button class="side-link" data-page="profile">MY PAGE</button>
        <button class="side-link mail-link" data-page="mail">信箱 <i id="mailBadge">1</i></button>
        <button class="board-switch active" data-board="cat">😼<span>猫版</span></button>
        <button class="board-switch" data-board="dog">🐶<span>狗版</span></button>
        <button class="board-switch locked" data-board="bird">🐦<span>鸟版</span></button>
        <button class="side-link" data-page="help">使用说明</button>
        <div class="coin">善币<br><strong id="coinCount">12500</strong><small>每日登录 +1</small></div>
      </aside>

      <section class="content" id="content" aria-live="polite"></section>
    </main>

    <nav class="mobile-nav">
      <button data-page="home">善<small>首页</small></button>
      <button data-board="cat">😼<small>猫版</small></button>
      <button data-board="dog">🐶<small>狗版</small></button>
      <button data-page="profile">●<small>我的</small></button>
    </nav>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <div class="modal" id="genericModal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <button class="modal-close" data-close-modal>×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox-close" data-close-lightbox>×</button>
    <div class="fake-photo" id="lightboxPhoto"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
