<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#241b2f">
  <meta name="description" content="日行一善 · M-TOWN 匿名论坛互动演示">
  <title>日行一善 · M-TOWN 黑市论坛</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="desktop-wrapper">
    <header class="browser-header">
      <div class="browser-title"><span class="pixel-mark">◆</span> FOUND-DOG.ONLINE / M-TOWN BBS <span class="version">V3.1</span></div>
      <div class="window-controls" aria-hidden="true"><span>_</span><span>□</span><span>×</span></div>
      <div class="address-row">
        <button class="browser-mini" id="browserBack" title="返回">←</button>
        <button class="browser-mini" id="browserRefresh" title="刷新">↻</button>
        <div class="address-bar" id="addressBar">http://found-dog.online/m-town/bbs/index.html</div>
      </div>
    </header>

    <div class="mobile-topbar">
      <button class="mobile-brand" id="mobileBrand">FOUND-DOG.ONLINE</button>
      <span id="mobileCoins">🐟 12500</span>
    </div>

    <div class="layout">
      <aside class="sidebar">
        <div class="hanging-line"></div>
        <button class="side-item seal" id="homeBtn" title="首页">善</button>
        <div class="party-toggle side-item">
          <button class="pixel-btn toggle active" id="btnLand">陆党</button>
          <button class="pixel-btn toggle" id="btnWater">水党</button>
        </div>
        <button class="side-item pixel-btn text-link land-only" id="navProfile">主页</button>
        <button class="side-item pixel-btn text-link land-only" id="navMail">信箱 <span class="badge" id="mailBadge">1</span></button>
        <button class="side-item icon-link active" id="navCat">😼<small>猫版</small></button>
        <button class="side-item icon-link" id="navDog">🐶<small>狗版</small></button>
        <button class="side-item icon-link locked" id="navBird" title="善币累计达到10000后开放">🐦<small>聚宝楼</small></button>
        <button class="side-item pixel-btn text-link" id="navSearch">检索</button>
        <button class="side-item pixel-btn text-link land-only" id="navCompose">发帖</button>
        <div class="side-item coin-display land-only">🐟<br><span id="coinCount">12500</span></div>
        <button class="side-item pixel-btn admin-switch land-only" id="adminToggle">BLACK<br>HAND</button>
      </aside>

      <main class="content-shell">
        <div class="ticker"><span id="tickerText">◆ M町匿名互助论坛 ◆ 严禁人肉 ◆ 违规者由 BLACKHAND 亲自处理 ◆</span></div>
        <section class="content" id="appContent" aria-live="polite"></section>
      </main>
    </div>
  </div>

  <nav class="mobile-nav" aria-label="移动端导航">
    <button class="nav-btn active" id="mobileHome"><span class="icon">⌂</span><span>首页</span></button>
    <button class="nav-btn" id="mobileCat"><span class="icon">猫</span><span>悬赏</span></button>
    <button class="nav-btn" id="mobileDog"><span class="icon">犬</span><span>八卦</span></button>
    <button class="nav-btn" id="mobileSearch"><span class="icon">⌕</span><span>检索</span></button>
    <button class="nav-btn land-only" id="mobileMore"><span class="icon">＋</span><span>我的</span></button>
  </nav>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head"><b id="modalTitle">提示</b><button id="modalClose" aria-label="关闭">×</button></div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>
  <div class="toast-stack" id="toastStack" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
